name: Keepalive Workflow
on:
  schedule:
    - cron: '0 0 */10 * *'
  workflow_dispatch:

jobs:
  keepalive:
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - uses: actions/checkout@v4
      - uses: allstaralok/workflow-keepalive@v1 # 替换为替代 Action
        with:
          workflow_files: "签到.yml"
